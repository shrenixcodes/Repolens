[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repolens-config"
version = "0.1.0"
description = "Layered configuration (defaults -> YAML file -> environment variables) for RepoLens."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.4,<3",
  "PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repolens_config"]
