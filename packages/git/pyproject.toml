[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repolens-git"
version = "0.1.0"
description = "Git history, blame, and commit intelligence for RepoLens."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "repolens-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repolens_git"]
