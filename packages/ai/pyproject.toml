[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repolens-ai"
version = "0.1.0"
description = "Provider-agnostic LLM and embedding abstractions for RepoLens."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "repolens-shared",
  "repolens-config",
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repolens_ai"]
