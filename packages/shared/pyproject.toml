[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repolens-shared"
version = "0.1.0"
description = "Common types, exceptions, and path-safety utilities shared across RepoLens packages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/repolens_shared"]
