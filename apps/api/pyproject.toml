[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repolens-api"
version = "0.1.0"
description = "The RepoLens HTTP API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "repolens-shared",
  "repolens-config",
  "repolens-indexer",
  "repolens-graph",
  "repolens-retrieval",
  "repolens-ai",
  "repolens-git",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.4,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
repolens-api = "repolens_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repolens_api"]
