name: Bug report
description: Something doesn't work the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, repository structure, repolens.yaml used, etc.
      placeholder: |
        1. repolens index
        2. repolens ask "..."
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RepoLens version / commit
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - CLI
        - API
        - Web UI
        - Parser (Python/JS/TS)
        - Indexer
        - Graph / Impact analysis
        - Retrieval / Ask
        - Git intelligence
        - Docker / deployment
        - Other
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version, how you installed RepoLens.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      render: shell
